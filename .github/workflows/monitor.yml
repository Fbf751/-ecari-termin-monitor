name: eCARI Monitor

# No schedule trigger: portal.stva.zh.ch blocks traffic from GitHub Actions'
# datacenter IPs (confirmed via two live test runs, both net::ERR_TIMED_OUT
# at the exact same spot - the same page loads instantly from a normal
# connection). The bot now runs locally instead, via Windows Task Scheduler
# (see README.md "Lokal laufen lassen"). Kept as workflow_dispatch only, in
# case a future free-tier host turns out not to be blocked.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecari-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-bot.txt

      - name: Playwright Browser installieren
        run: python -m playwright install --with-deps chromium

      - name: Monitor ausführen
        env:
          ECARI_HALTER_NUMMER: ${{ secrets.ECARI_HALTER_NUMMER }}
          ECARI_GEBURTSDATUM: ${{ secrets.ECARI_GEBURTSDATUM }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.monitor

      - name: Debug-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Status committen
        if: always()
        run: |
          git config user.name "ecari-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/found.json
          if ! git diff --cached --quiet; then
            git commit -m "Status aktualisieren"
            git push
          fi
